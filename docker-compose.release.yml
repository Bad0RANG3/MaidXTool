# 发布版编排：只拉取镜像、不构建。
# 用法：先把镜像推到 Docker Hub / 私有 registry（见 docker/README.md），
#       然后在服务器上：docker compose -f docker-compose.release.yml up -d
# 自定义镜像名：MAIDX_IMAGE=bad0rang3/maidxtool:0.1.0 docker compose -f docker-compose.release.yml up -d
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      # 预置 OneBot v11 正向 WebSocket 服务端（0.0.0.0:3001），登录 QQ 后自动生效。
      MODE: ws
      WEBUI_TOKEN: "${WEBUI_TOKEN:-napcat}"
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - napcat_qq:/app/.config/QQ
      - napcat_config:/app/napcat/config

  b50-bot:
    image: "${MAIDX_IMAGE:-bad0rang3/maidxtool:0.1.0}"
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DRIVER: "~httpx+~websockets"
      # 连接 NapCat 的 OneBot v11 正向 WebSocket（MODE=ws 预置的 3001 服务端）。
      ONEBOT_WS_URLS: '["ws://napcat:3001"]'
      B50_DATA_DIR: /data
    volumes:
      - b50_data:/data

volumes:
  napcat_qq:
  napcat_config:
  b50_data:
